services:

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      # Uploaded documents persist across restarts
      - ./backend/uploads:/app/uploads
      # SQLite database (only used when DATABASE_URL points to SQLite)
      - ./backend/tac.db:/app/tac.db
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── React frontend (Vite build served by nginx) ──────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # ── PostgreSQL (optional) ─────────────────────────────────────────────────────
  # Enable with:  docker compose --profile postgres up
  # Then set DATABASE_URL=postgresql+asyncpg://tac:${POSTGRES_PASSWORD}@db/tac in backend/.env
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: tac
      POSTGRES_USER: tac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tac"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
